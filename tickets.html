<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>BloxTalk | Tickets</title><style> *{box-sizing:border-box}body{margin:0;background:#100c20;color:#f9f5ff;font:16px/1.6 system-ui}header,main{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #67437b}a{color:#f4a1d0}h1{font-size:clamp(2rem,5vw,4rem);line-height:1.1}article{background:#251a3d;border:1px solid #67437b;border-radius:20px;padding:28px;margin:24px 0}button{background:#9333ea;color:white;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}p{color:#c8bbd9}small{color:#f4a1d0}</style></head><body><header><strong>BLOXTALK / ADMISSIONS</strong><a href="index.html">Home</a></header><main><small>OFFICIAL STUDIO TICKETING</small><h1>Your seat. Your show.</h1><p>Sign in with Roblox to access the BloxTalk admissions system.</p><article><h2>Guest account</h2><p id="status" role="status">Checking session…</p><button id="login" hidden>Sign in with Roblox</button><button id="logout" hidden>Sign out</button></article><article><h2>Reservations coming soon</h2><p>Seat reservations are currently closed while we verify the auditorium layout and admission controls.</p></article></main><script>
const base='https://viyyviputrbdqrfmymxs.supabase.co/functions/v1/';const statusEl=document.getElementById('status'),login=document.getElementById('login'),logout=document.getElementById('logout');const hex=a=>Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
async function api(action,extra={}){const token=sessionStorage.getItem('bt_token');const r=await fetch(base+'bt-auth-handoff-ts',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...extra}),credentials:'omit'});const d=await r.json();if(!r.ok){const e=new Error(d.error||'Request failed');e.status=r.status;throw e}return d}
login.onclick=async()=>{login.disabled=true;try{const verifier=hex(crypto.getRandomValues(new Uint8Array(32)));sessionStorage.setItem('bt_verifier',verifier);const challenge=hex(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))));location.assign(base+'roblox-auth-start?browser_challenge='+challenge)}catch(e){statusEl.textContent=e.message;login.disabled=false}};
logout.onclick=async()=>{logout.disabled=true;try{await api('logout');sessionStorage.removeItem('bt_token');location.reload()}catch(e){statusEl.textContent=e.message;logout.disabled=false}};
(async()=>{try{const code=new URLSearchParams(location.hash.slice(1)).get('code');if(code){history.replaceState(null,'',location.pathname+location.search);const verifier=sessionStorage.getItem('bt_verifier');sessionStorage.removeItem('bt_verifier');if(!verifier)throw new Error('Login must finish in the same tab. Please sign in again.');const d=await api('redeem',{code,verifier});sessionStorage.setItem('bt_token',d.token)}if(!sessionStorage.getItem('bt_token')){statusEl.textContent='Not signed in';login.hidden=false;return}const d=await api('session');statusEl.textContent='Signed in as '+d.guest.display_name+' (@'+d.guest.username+')';logout.hidden=false}catch(e){if(e.status===401)sessionStorage.removeItem('bt_token');statusEl.textContent=e.message;login.hidden=false}})();
</script></body></html>
