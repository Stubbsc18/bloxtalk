<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BloxTalk | Careers</title><meta name="description" content="Explore open positions with BloxTalk, the Roblox talk show."><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(145deg,#0a0e2d,#18103d 60%,#0a0e2d);color:#f8f7ff;min-height:100vh}a{color:inherit;text-decoration:none}header{background:#080b29;border-bottom:1px solid #393254}nav{max-width:1150px;margin:auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.logo{font-weight:950;font-size:23px;letter-spacing:-1px}.logo span{color:#ee30ad}.links{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.login{background:linear-gradient(90deg,#8e34e8,#ed2ca7);padding:11px 19px;border-radius:24px;font-weight:800}main{max-width:1150px;margin:auto;padding:72px 24px 110px}.eyebrow{color:#298bff;text-transform:uppercase;letter-spacing:.22em;font-size:13px;font-weight:850}h1{font-size:clamp(38px,6vw,70px);line-height:1.1;margin:12px 0 22px}h2{margin:0;font-size:24px}.intro{color:#c8c5e2;max-width:700px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:22px;margin-top:44px}.card{border:1px solid #393564;background:linear-gradient(150deg,#211a49,#101332);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:12px}.tag{color:#9fbbff;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.meta{color:#c2c0d9;font-size:14px}.body{white-space:pre-wrap;overflow-wrap:anywhere;color:#d5d3e8}.requirements{border-top:1px solid #46416c;padding-top:14px}.apply{display:inline-block;align-self:flex-start;background:linear-gradient(90deg,#8b37ec,#ed2aa8);padding:11px 19px;border-radius:25px;font-weight:800;margin-top:auto}.apply:hover,.login:hover{filter:brightness(1.14)}.notice{border:1px solid #494474;border-radius:14px;padding:20px;margin-top:30px;color:#cbc8e4}footer{text-align:center;border-top:1px solid #393254;padding:30px;color:#bbb7d8}
</style></head><body><header><nav><a class="logo" href="index.html">BLOX<span>TALK.</span></a><div class="links"><a href="index.html">Home</a><a href="index.html#hosts">Hosts</a><a href="index.html#shows">Shows</a><a href="index.html#gallery">Gallery</a><a class="login" href="staff.html">Staff Login</a></div></nav></header><main><div class="eyebrow">Be part of the show</div><h1>Careers at BloxTalk</h1><p class="intro">Help bring the Roblox talk show to life. Explore opportunities with our hosting, production, and creative teams.</p><div id="positions" class="grid" aria-live="polite"></div><div id="message" class="notice">Loading open positions…</div></main><footer>© <span id="year"></span> BloxTalk · The Roblox Talk Show</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script>
(async()=>{'use strict';document.getElementById('year').textContent=new Date().getFullYear();const grid=document.getElementById('positions'),message=document.getElementById('message');
if(!window.supabase||!window.BLOXTALK_SUPABASE_URL||!window.BLOXTALK_SUPABASE_ANON_KEY){message.textContent='Career listings are temporarily unavailable.';return;}
const db=window.supabase.createClient(window.BLOXTALK_SUPABASE_URL,window.BLOXTALK_SUPABASE_ANON_KEY);
const {data,error}=await db.from('public_careers').select('title,department,employment_type,location,description,requirements,application_url').eq('is_open',true).order('sort_order',{ascending:true}).order('created_at',{ascending:false});
if(error){message.textContent='Unable to load open positions right now.';console.warn(error.message);return;}
if(!data?.length){message.textContent='There are no open positions at the moment. Check back soon!';return;}
message.hidden=true;
function add(parent,tag,value,cls){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=value||'';parent.append(el);return el;}
for(const p of data){const card=document.createElement('article');card.className='card';add(card,'div',p.department,'tag');add(card,'h2',p.title);add(card,'div',[p.employment_type,p.location].filter(Boolean).join(' · '),'meta');if(p.description)add(card,'p',p.description,'body');if(p.requirements){const section=add(card,'div','','requirements');add(section,'strong','Requirements');add(section,'p',p.requirements,'body');}
if(p.application_url){try{const url=new URL(p.application_url);if(url.protocol==='https:'){const a=document.createElement('a');a.className='apply';a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Apply for this position';card.append(a)}}catch{}}
else add(card,'div','Applications not yet open','meta');grid.append(card);}
})();</script></body></html>
