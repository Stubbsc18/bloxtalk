<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BloxMaster Admin</title><style>*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#f4f6fa;color:#182238}header{background:#024ddf;color:white;padding:18px 24px;display:flex;align-items:center;gap:20px}header strong{font-size:28px;font-style:italic;letter-spacing:-1.5px}header span{flex:1}button{font:inherit;cursor:pointer;border:0;border-radius:5px;padding:10px 15px;background:#024ddf;color:white}header button{background:white;color:#024ddf}main{max-width:1200px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav button{background:white;color:#024ddf;border:1px solid #dce3ee}nav button.active{background:#024ddf;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,section{background:white;border:1px solid #dce3ee;border-radius:8px;padding:20px}.card strong{display:block;font-size:30px;color:#024ddf;margin-top:10px}section{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:12px;border-bottom:1px solid #e4e8ef;white-space:nowrap}input{padding:10px;border:1px solid #cbd5e1;border-radius:5px;width:100%;max-width:360px;margin-bottom:15px}small{color:#64748b}#status{white-space:pre-wrap} [hidden]{display:none!important}</style><header><strong>bloxmaster</strong><span>Administration</span><button id="logout" hidden>Sign out</button></header><main><h1>Executive dashboard</h1><p id="status" role="status">Checking staff session…</p><button id="login" hidden>Sign in with Discord</button><div id="portal" hidden><button id="refresh">Refresh data</button><nav id="nav"></nav><div id="content"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script>
const $=id=>document.getElementById(id);let db,data,tab='Overview';const tabs=['Overview','Events','Seats','Reservations','Guests'];const tiers=['General','Plus','Select','Gold','Premiere'];function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);return n}function hide(){data=null;$('portal').hidden=true;$('content').replaceChildren();$('nav').replaceChildren()}function date(v){return v?new Date(v).toLocaleString():'—'}function render(){if(!data)return;const c=$('content');c.replaceChildren();$('nav').replaceChildren();for(const t of tabs){const b=node('button',t);b.className=t===tab?'active':'';b.onclick=()=>{tab=t;render()};$('nav').append(b)}if(tab==='Overview'){const grid=node('div');grid.className='cards';for(const [label,key] of [['Candidate seats','total_seats'],['Approved seats','approved_seats'],['Blocked seats','blocked_seats'],['Active tickets','active_tickets'],['Registered guests','registered_guests']]){const card=node('div',label);card.className='card';card.append(node('strong',data.statistics[key]??0));grid.append(card)}c.append(grid);return}const configs={Events:[data.shows,['Production','Starts','Audience','Reservations'],r=>[r.title,date(r.starts_at),r.audience_mode,r.reservations_open?'Open':'Closed']],Seats:[data.seats,['Seat','Tier','Approval','Blocked'],r=>[r.id,tiers[r.tier]??r.tier,r.approved?'Approved':'Pending',r.blocked?'Yes':'No']],Reservations:[data.tickets,['Ticket ID','Production','Seat','Roblox ID','Status'],r=>[r.id,data.shows.find(s=>s.id===r.show_id)?.title??r.show_id,r.seat_id,r.roblox_id,r.cancelled_at?'Cancelled':'Active']],Guests:[data.guests,['Username','Display name','Roblox ID','Last login'],r=>[r.username,r.display_name,r.roblox_id,date(r.last_login)]]};const [rows,heads,map]=configs[tab];const section=node('section');const search=node('input');search.placeholder='Search '+tab.toLowerCase();search.setAttribute('aria-label',search.placeholder);const table=node('table'),head=node('thead'),tr=node('tr'),body=node('tbody');heads.forEach(h=>tr.append(node('th',h)));head.append(tr);table.append(head,body);function fill(){body.replaceChildren();for(const r of rows){const vals=map(r);if(!vals.join(' ').toLowerCase().includes(search.value.toLowerCase()))continue;const line=node('tr');vals.forEach(v=>line.append(node('td',v??'—')));body.append(line)}if(!body.children.length){const line=node('tr'),cell=node('td','No matching records');cell.colSpan=heads.length;line.append(cell);body.append(line)}}search.oninput=fill;fill();section.append(search,table);c.append(section)}async function load(){hide();$('status').textContent='Verifying executive access…';try{const {data:{session},error}=await db.auth.getSession();if(error)throw error;$('login').hidden=!!session;$('logout').hidden=!session;if(!session){$('status').textContent='Executive Team sign-in required.';return}const response=await fetch(window.BLOXTALK_SUPABASE_URL+'/functions/v1/bt-ticket-admin',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:window.BLOXTALK_SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'overview'})});const result=await response.json();if(!response.ok||result.authorized!==true)throw Error(result.error||'Access denied');data=result;render();$('portal').hidden=false;$('status').textContent='Executive access verified • Read-only preview';}catch(e){hide();$('status').textContent=e.message||'Unable to connect'}}async function init(){try{db=window.supabase.createClient(window.BLOXTALK_SUPABASE_URL,window.BLOXTALK_SUPABASE_ANON_KEY);$('login').onclick=async()=>{const {error}=await db.auth.signInWithOAuth({provider:'discord',options:{redirectTo:location.origin+location.pathname}});if(error)$('status').textContent=error.message};$('logout').onclick=async()=>{hide();await db.auth.signOut();await load()};$('refresh').onclick=load;await load()}catch(e){$('status').textContent='Configuration error: '+e.message}}init();
</script></html>
