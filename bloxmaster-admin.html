<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BloxMaster Admin</title><style>*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#f4f6fa;color:#182238}header{background:#024ddf;color:white;padding:18px 24px;display:flex;align-items:center;gap:20px}header strong{font-size:28px;font-style:italic;letter-spacing:-1.5px}header span{flex:1}button{font:inherit;cursor:pointer;border:0;border-radius:5px;padding:10px 15px;background:#024ddf;color:white}header button{background:white;color:#024ddf}main{max-width:1200px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav button{background:white;color:#024ddf;border:1px solid #dce3ee}nav button.active{background:#024ddf;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,section{background:white;border:1px solid #dce3ee;border-radius:8px;padding:20px}.card strong{display:block;font-size:30px;color:#024ddf;margin-top:10px}section{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:12px;border-bottom:1px solid #e4e8ef;white-space:nowrap}input{padding:10px;border:1px solid #cbd5e1;border-radius:5px;width:100%;max-width:360px;margin-bottom:15px}small{color:#64748b}#status{white-space:pre-wrap} [hidden]{display:none!important}</style><header><strong>bloxmaster</strong><span>Administration</span><button id="logout" hidden>Sign out</button></header><main><h1>Executive dashboard</h1><p id="status" role="status">Checking staff session…</p><button id="login" hidden>Sign in with Discord</button><div id="portal" hidden><button id="refresh">Refresh data</button><nav id="nav"></nav><div id="content"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script>
const $=id=>document.getElementById(id);let db,data,tab='Overview';const tabs=['Overview','Production Control','Events','Seats','Reservations','Guests','Audit'];const tiers=['General','Plus','Select','Gold','Premiere'];function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);return n}function hide(){data=null;$('portal').hidden=true;$('content').replaceChildren();$('nav').replaceChildren()}function date(v){return v?new Date(v).toLocaleString():'—'}function render(){if(!data)return;const c=$('content');c.replaceChildren();$('nav').replaceChildren();for(const t of tabs){const b=node('button',t);b.className=t===tab?'active':'';b.onclick=()=>{tab=t;render()};$('nav').append(b)}if(tab==='Production Control'){productionControl(c);return}if(tab==='Overview'){const grid=node('div');grid.className='cards';for(const [label,key] of [['Candidate seats','total_seats'],['Approved seats','approved_seats'],['Blocked seats','blocked_seats'],['Active tickets','active_tickets'],['Registered guests','registered_guests']]){const card=node('div',label);card.className='card';card.append(node('strong',data.statistics[key]??0));grid.append(card)}c.append(grid);return}if(tab==='Events'||tab==='Seats'||tab==='Reservations'){manage(c);return}const configs={Audit:[data.audit||[],['Date','Action','Executive','Details'],r=>[date(r.created_at),r.action,r.actor_id,JSON.stringify(r.details)]],Events:[data.shows,['Production','Starts','Audience','Reservations'],r=>[r.title,date(r.starts_at),r.audience_mode,r.reservations_open?'Open':'Closed']],Seats:[data.seats,['Seat','Tier','Approval','Blocked'],r=>[r.id,tiers[r.tier]??r.tier,r.approved?'Approved':'Pending',r.blocked?'Yes':'No']],Reservations:[data.tickets,['Ticket ID','Production','Seat','Roblox ID','Status'],r=>[r.id,data.shows.find(s=>s.id===r.show_id)?.title??r.show_id,r.seat_id,r.roblox_id,r.cancelled_at?'Cancelled':'Active']],Guests:[data.guests,['Username','Display name','Roblox ID','Last login'],r=>[r.username,r.display_name,r.roblox_id,date(r.last_login)]]};const [rows,heads,map]=configs[tab];const section=node('section');const search=node('input');search.placeholder='Search '+tab.toLowerCase();search.setAttribute('aria-label',search.placeholder);const table=node('table'),head=node('thead'),tr=node('tr'),body=node('tbody');heads.forEach(h=>tr.append(node('th',h)));head.append(tr);table.append(head,body);function fill(){body.replaceChildren();for(const r of rows){const vals=map(r);if(!vals.join(' ').toLowerCase().includes(search.value.toLowerCase()))continue;const line=node('tr');vals.forEach(v=>line.append(node('td',v??'—')));body.append(line)}if(!body.children.length){const line=node('tr'),cell=node('td','No matching records');cell.colSpan=heads.length;line.append(cell);body.append(line)}}search.oninput=fill;fill();section.append(search,table);c.append(section)}async function mutate(action,data){if(!confirm('Confirm '+action.replaceAll('_',' ')+'?'+(data.show_id?'\nProduction: '+(window.document.querySelector('#content select')?.selectedOptions[0]?.textContent||data.show_id):'')))return;try{const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Sign in required');const r=await fetch(window.BLOXTALK_SUPABASE_URL+'/functions/v1/bt-ticket-admin',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:window.BLOXTALK_SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({action,data})});const d=await r.json();if(!r.ok)throw Error(d.error);await load()}catch(e){alert(e.message)}}
function manage(c){const sec=node('section');c.append(sec);const btn=(label,fn,parent=sec)=>{const b=node('button',label);b.style.margin='4px';b.onclick=fn;parent.append(b);return b};const select=(items,parent=sec)=>{const x=node('select');x.style.padding='10px';for(const [v,l] of items){const o=node('option',l);o.value=v;x.append(o)}parent.append(x);return x};const input=(label,value,type='text')=>{sec.append(node('p',label));const x=node('input');x.type=type;x.value=value;sec.append(x);return x};if(tab==='Events'){const pick=select([['','New production'],...data.shows.map(s=>[s.id,s.title])]);const title=input('Production title','');const starts=input('Start date/time (your local time)','','datetime-local');sec.append(node('p','Audience mode'));const mode=select([['ticketed','Ticketed'],['open','Open'],['streaming_only','Streaming only']]);sec.append(node('p','Reservations'));const open=select([['false','Closed'],['true','Open']]);pick.onchange=()=>{const s=data.shows.find(s=>s.id===pick.value);title.value=s?.title||'';starts.value=s?new Date(new Date(s.starts_at).getTime()-new Date(s.starts_at).getTimezoneOffset()*60000).toISOString().slice(0,16):'';mode.value=s?.audience_mode||'ticketed';open.value=String(s?.reservations_open||false)};btn('Save production',()=>{if(!title.value.trim()||!starts.value)return alert('Enter title and start time');mutate('save_event',{id:pick.value||null,title:title.value,starts_at:new Date(starts.value).toISOString(),audience_mode:mode.value,reservations_open:open.value==='true'})});return}if(tab==='Seats'){sec.append(node('p','Select seats on the coordinate map. Verify physical seat classifications before approval.'));const tier=select(tiers.map((t,i)=>[i,t]));const selected=new Set();const info=node('p');sec.append(info);const map=document.createElementNS('http://www.w3.org/2000/svg','svg');map.setAttribute('viewBox','0 0 800 440');map.style.width='100%';map.style.background='#f4f6fa';sec.append(map);function draw(){map.replaceChildren();const rows=data.seats.filter(s=>String(s.tier)===tier.value);const xs=rows.map(s=>Number(s.x)),zs=rows.map(s=>Number(s.z));const minX=Math.min(...xs),minZ=Math.min(...zs),scale=Math.min(750/Math.max(1,Math.max(...xs)-minX),390/Math.max(1,Math.max(...zs)-minZ));for(const s of rows){const dot=document.createElementNS(map.namespaceURI,'circle');dot.setAttribute('cx',25+(Number(s.x)-minX)*scale);dot.setAttribute('cy',25+(Number(s.z)-minZ)*scale);dot.setAttribute('r','5');dot.setAttribute('fill',selected.has(s.id)?'#024ddf':s.blocked?'#dc2626':s.approved?'#16a34a':'#94a3b8');dot.setAttribute('tabindex','0');dot.style.cursor='pointer';const tip=document.createElementNS(map.namespaceURI,'title');tip.textContent=s.id;dot.append(tip);const toggle=()=>{selected.has(s.id)?selected.delete(s.id):selected.add(s.id);draw()};dot.onclick=toggle;dot.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}};map.append(dot)}info.textContent=selected.size+' selected • Blue selected / green approved / gray pending / red blocked'}tier.onchange=()=>{selected.clear();draw()};btn('Select entire tier',()=>{data.seats.filter(s=>String(s.tier)===tier.value).forEach(s=>selected.add(s.id));draw()});btn('Clear selection',()=>{selected.clear();draw()});for(const [label,approved,blocked] of [['Approve / unblock',true,false],['Block',true,true],['Return to pending',false,false]])btn(label,()=>{if(selected.size)mutate('set_seats',{ids:[...selected],approved,blocked})});draw();return}const active=data.tickets.filter(t=>!t.cancelled_at);sec.append(node('h2','Show-specific seat transfers'));const show=select([['','Select production'],...data.shows.filter(s=>!s.ended_at&&s.audience_mode==='ticketed').map(s=>[s.id,s.title])]);const pick=select([['','Select reservation']]);const action=select([['move_ticket','Move within tier'],['upgrade_ticket','Manual upgrade'],['downgrade_ticket','Downgrade']]);const tier=select([]);const info=node('p');sec.append(info);const reason=input('Upgrade reason (required for upgrades)','');reason.maxLength=500;const map=document.createElementNS('http://www.w3.org/2000/svg','svg');map.setAttribute('viewBox','0 0 800 440');map.style.width='100%';map.style.background='#f4f6fa';sec.append(map);sec.append(node('p','Green: available • Gray: occupied • Red: blocked/pending • Purple: current seat • Blue: selected. Coordinate view, not a verified floor plan.'));let chosen=null;const confirmBtn=btn('Confirm transfer',()=>{const t=active.find(t=>t.id===pick.value);if(!t||!chosen)return;if(action.value==='upgrade_ticket'&&!reason.value.trim())return alert('Enter an upgrade reason');mutate(action.value,{ticket_id:t.id,show_id:t.show_id,seat_id:chosen,reason:reason.value.trim()})});btn('Revoke ticket',()=>{if(pick.value)mutate('revoke_ticket',{ticket_id:pick.value})});function draw(){map.replaceChildren();const t=active.find(t=>t.id===pick.value);confirmBtn.disabled=!chosen||!t;info.textContent=t?'Current: '+tiers[t.tier]+' • '+t.seat_id+' | Destination: '+(chosen||'Select a seat'):'Select a reservation';if(!t)return;const rows=data.seats.filter(s=>String(s.tier)===tier.value);if(!rows.length)return;const xs=rows.map(s=>Number(s.x)),zs=rows.map(s=>Number(s.z));const minX=Math.min(...xs),minZ=Math.min(...zs),scale=Math.min(740/Math.max(1,Math.max(...xs)-minX),380/Math.max(1,Math.max(...zs)-minZ));for(const s of rows){const occupied=active.some(a=>a.show_id===t.show_id&&a.seat_id===s.id&&a.id!==t.id);const current=s.id===t.seat_id;const available=s.approved&&!s.blocked&&!occupied&&!current;const dot=document.createElementNS(map.namespaceURI,'circle');dot.setAttribute('cx',30+(Number(s.x)-minX)*scale);dot.setAttribute('cy',30+(Number(s.z)-minZ)*scale);dot.setAttribute('r','6');dot.setAttribute('fill',chosen===s.id?'#024ddf':current?'#9333ea':!s.approved||s.blocked?'#dc2626':occupied?'#94a3b8':'#16a34a');const tip=document.createElementNS(map.namespaceURI,'title');tip.textContent=s.id+' — '+(available?'Available':current?'Current seat':occupied?'Occupied':'Unavailable');dot.append(tip);if(available){dot.style.cursor='pointer';dot.setAttribute('tabindex','0');dot.setAttribute('aria-label',tip.textContent);dot.setAttribute('role','button');const choose=()=>{chosen=s.id;draw()};dot.onclick=choose;dot.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}}}map.append(dot)}}function sections(){chosen=null;tier.replaceChildren();const t=active.find(t=>t.id===pick.value);if(t)tiers.forEach((name,i)=>{if(action.value==='move_ticket'?i===t.tier:action.value==='upgrade_ticket'?i>t.tier:i<t.tier){const o=node('option',name);o.value=i;tier.append(o)}});draw()}show.onchange=()=>{pick.replaceChildren(node('option','Select reservation'));pick.options[0].value='';for(const t of active.filter(t=>t.show_id===show.value)){const g=data.guests.find(g=>g.roblox_id===t.roblox_id);const o=node('option',(g?.username||t.roblox_id)+' • '+tiers[t.tier]+' • '+t.seat_id);o.value=t.id;pick.append(o)}sections()};pick.onchange=sections;action.onchange=sections;tier.onchange=()=>{chosen=null;draw()};draw();}
function productionControl(c){
 const sec=node('section');c.append(sec);sec.append(node('h2','Production Control Center'));
 const active=data.active_productions||[];
 sec.append(node('h3',active.length>1?'Conflict — multiple active productions':active.length===1?(active[0].audience_mode==='streaming_only'?'STAFF ONLY':'TICKETED'):'PUBLIC'));
 sec.append(node('p',active.map(s=>s.title).join(', ')||'No active restricted production'));
 sec.append(node('small','Database status at '+date(data.server_time)+' • Roblox refreshes approximately every 30 seconds. This is not a live server acknowledgement.'));
 const pick=node('select');pick.style.cssText='display:block;padding:12px;margin:20px 0;max-width:100%';
 for(const s of data.shows){const o=node('option',s.title+(s.ended_at?' (Concluded)':''));o.value=s.id;pick.append(o)}sec.append(pick);
 if(active.length===1)pick.value=active[0].id;
 const details=node('div');sec.append(details);
 function draw(){details.replaceChildren();const s=data.shows.find(x=>x.id===pick.value);if(!s){details.append(node('p','Create a production in Events first.'));return}
 const lock=new Date(new Date(s.starts_at).getTime()-7200000);const mins=Math.max(0,Math.ceil((lock.getTime()-new Date(data.server_time).getTime())/60000));
 for(const line of ['Showtime: '+date(s.starts_at),'Scheduled lock: '+date(lock),'Audience: '+s.audience_mode,'Lock setting: '+(s.ended_at?'Concluded':!s.server_lock_enabled?'Disabled':s.manual_lock?'Manual lock':'Automatic lock armed'),'Countdown at last refresh: '+(s.server_lock_enabled&&!s.manual_lock&&!s.ended_at&&s.audience_mode!=='open'?mins+' minutes':'Not scheduled')])details.append(node('p',line));
 const add=(label,action,disabled,warning=false)=>{const b=node('button',label);b.style.margin='4px';if(warning)b.style.background='#b91c1c';b.disabled=disabled;b.style.opacity=disabled?'.5':'1';b.onclick=()=>mutate(action,{show_id:s.id});details.append(b)};
 const unavailable=!!s.ended_at||s.audience_mode==='open';
 add('Enable automatic lock','enable_auto_lock',unavailable);add('Lock server now','lock_server',unavailable,true);add('Emergency unlock / disable lock','emergency_unlock',!s.server_lock_enabled,true);add('Conclude production','conclude_production',!!s.ended_at,true);
 details.append(node('p','Unlock disables both manual and scheduled locking for this production. Concluding closes reservations and cannot be undone here. Refresh data to update status and countdown.'));
 }pick.onchange=draw;draw();
}

async function load(){hide();$('status').textContent='Verifying executive access…';try{const {data:{session},error}=await db.auth.getSession();if(error)throw error;$('login').hidden=!!session;$('logout').hidden=!session;if(!session){$('status').textContent='Executive Team sign-in required.';return}const response=await fetch(window.BLOXTALK_SUPABASE_URL+'/functions/v1/bt-ticket-admin',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:window.BLOXTALK_SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'overview'})});const result=await response.json();if(!response.ok||result.authorized!==true)throw Error(result.error||'Access denied');data=result;render();$('portal').hidden=false;$('status').textContent='Executive access verified • Management enabled';}catch(e){hide();$('status').textContent=e.message||'Unable to connect'}}async function init(){try{db=window.supabase.createClient(window.BLOXTALK_SUPABASE_URL,window.BLOXTALK_SUPABASE_ANON_KEY);$('login').onclick=async()=>{const {error}=await db.auth.signInWithOAuth({provider:'discord',options:{redirectTo:location.origin+location.pathname}});if(error)$('status').textContent=error.message};$('logout').onclick=async()=>{hide();await db.auth.signOut();await load()};$('refresh').onclick=load;await load()}catch(e){$('status').textContent='Configuration error: '+e.message}}init();
</script></html>
