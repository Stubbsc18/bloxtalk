<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BloxTalk Admin</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b29;color:#f9f7ff;font:16px/1.5 system-ui,sans-serif}header{padding:24px;background:#14143a;border-bottom:1px solid #473b83}main{max-width:1050px;margin:auto;padding:28px 18px}h1{margin:0}h2{margin:0 0 14px}p,small{color:#c7bedf}.notice{border:1px solid #167bff;background:#21154a;padding:16px;border-radius:12px;margin:20px 0}.panel{background:#14143a;border:1px solid #403b73;padding:22px;border-radius:16px;margin:18px 0}input,textarea{width:100%;background:#0b1030;color:#fff;border:1px solid #6852a4;border-radius:9px;padding:11px;font:inherit}textarea{min-height:75px}label{display:block;font-weight:650;margin:12px 0 5px}.item{border:1px solid #473b83;padding:16px;border-radius:12px;margin:12px 0}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row>*{flex:1}button,.link{display:inline-block;border:0;background:#7b35e9;color:#fff;padding:11px 16px;border-radius:9px;font-weight:750;cursor:pointer;text-decoration:none}button.secondary,.link{background:#25245c}button.danger{background:#b52970}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}#status{font-weight:700;color:#77b7ff}code{color:#f6c3f4}a{color:#ed8bdb}@media(max-width:600px){.row>*{flex-basis:100%}}button:not(.secondary):not(.danger){background:linear-gradient(110deg,#7b35e9,#f42ba8)}header{background:radial-gradient(ellipse at 80% 0%,#f42ba84a,transparent 60%),#14143a}.notice { display: none !important; }</style></head><body><header><h1>🎙️ BloxTalk Admin</h1><p>Secure Supabase login • Publish changes instantly</p></header><main><div class="notice" id="notice">Configure <code>supabase-config.js</code> and run <code>supabase-setup.sql</code> before signing in. <a href="./index.html">View website</a></div><section class="panel" id="loginPanel"><h2>Administrator sign in</h2><label for="email">Email</label><input id="email" type="email" autocomplete="username"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button id="login">Sign in</button></div></section><div id="editor" hidden><div class="actions"><button id="publish">Publish Live</button><button class="secondary" id="reload">Reload Live Content</button><button class="secondary" id="logout">Sign out</button></div><section class="panel"><h2>📣 Announcement</h2><label for="announcement">Announcement</label><input id="announcement" maxlength="300"></section><div id="sections"></div><div class="actions"><button id="publishBottom">Publish Live</button></div></div><p id="status" role="status" aria-live="polite"></p></main><script src="./supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const categories={hosts:{title:'🎤 Hosts',fields:['name','role','description']},production:{title:'🎬 Production personnel',fields:['name','role','description']},episodes:{title:'📺 Episodes',fields:['season','number','title','date','description']},events:{title:'📅 Events',fields:['title','date','description']}};
const defaults={announcement:'',hosts:[],production:[],episodes:[],events:[]};let state=structuredClone(defaults);const $=id=>document.getElementById(id);const status=t=>$('status').textContent=t;const configured=window.BLOXTALK_SUPABASE_URL&&window.BLOXTALK_SUPABASE_ANON_KEY&&!window.BLOXTALK_SUPABASE_URL.includes('YOUR-PROJECT');const client=configured?window.supabase.createClient(window.BLOXTALK_SUPABASE_URL,window.BLOXTALK_SUPABASE_ANON_KEY):null;
function validate(d){if(!d||typeof d!=='object')throw Error('Invalid content');for(const k of Object.keys(categories))if(!Array.isArray(d[k]))throw Error('Missing '+k);return d}
function render(){$('announcement').value=state.announcement||'';const root=$('sections');root.replaceChildren();for(const [key,config] of Object.entries(categories)){const panel=document.createElement('section');panel.className='panel';const heading=document.createElement('h2');heading.textContent=config.title;panel.append(heading);state[key].forEach((obj,i)=>{const item=document.createElement('div');item.className='item';for(const field of config.fields){const label=document.createElement('label');label.textContent=field[0].toUpperCase()+field.slice(1);const input=field==='description'?document.createElement('textarea'):document.createElement('input');input.value=obj[field]||'';input.maxLength=field==='description'?1500:200;input.addEventListener('input',()=>obj[field]=input.value);label.append(input);item.append(label)}const del=document.createElement('button');del.className='danger';del.textContent='Remove';del.onclick=()=>{state[key].splice(i,1);render()};item.append(del);panel.append(item)});const add=document.createElement('button');add.className='secondary';add.textContent='+ Add '+key.slice(0,-1);add.onclick=()=>{state[key].push(Object.fromEntries(config.fields.map(f=>[f,''])));render()};panel.append(add);root.append(panel)}}
async function load(){const {data,error}=await client.from('site_content').select('content').eq('id',1).single();if(error)throw error;state=validate(data.content);render()}
async function sessionView(){const {data:{session}}=await client.auth.getSession();$('loginPanel').hidden=!!session;$('editor').hidden=!session;if(session){try{await load();status('Live content loaded.')}catch(e){status('Cannot load content: '+e.message)}}}
$('login').onclick=async()=>{if(!client)return status('Configure Supabase first.');$('login').disabled=true;try{const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await sessionView()}catch(e){status('Sign-in failed: '+e.message)}finally{$('login').disabled=false}};
async function publish(){if(!client)return;state.announcement=$('announcement').value;const buttons=[$('publish'),$('publishBottom')];buttons.forEach(b=>b.disabled=true);status('Publishing...');try{const {error}=await client.from('site_content').update({content:state,updated_at:new Date().toISOString()}).eq('id',1);if(error)throw error;status('Published! Refresh the public website to see the changes.')}catch(e){status('Publish failed: '+e.message+' (check admin permission and RLS policies)')}finally{buttons.forEach(b=>b.disabled=false)}}
$('publish').onclick=publish;$('publishBottom').onclick=publish;$('reload').onclick=async()=>{if(!confirm('Discard unsaved changes?'))return;try{await load();status('Live content reloaded.')}catch(e){status(e.message)}};$('logout').onclick=async()=>{await client.auth.signOut();$('editor').hidden=true;$('loginPanel').hidden=false;status('Signed out.')};
if(client){client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){$('editor').hidden=true;$('loginPanel').hidden=false}});sessionView()}else status('Add your Supabase project URL and publishable/anon key to supabase-config.js first.');
</script></body></html>
